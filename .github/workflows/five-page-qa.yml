name: Five-page site QA
on:
  pull_request:
    paths: ['*.html', 'style.css', 'script.js', 'qa/**', '.github/workflows/five-page-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node qa/check-five-pages.mjs
      - run: node --check script.js
